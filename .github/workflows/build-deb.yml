name: Build Fouldecrypt (LIBKRW)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Force sync and update submodules
        run: |
          echo "::group::Force Sync Submodules"
          git submodule sync --recursive
          git submodule update --init --recursive --force --remote
          git submodule foreach --recursive git reset --hard
          echo "::endgroup::"

      - name: Install dependencies
        run: |
          echo "::group::Install Dependencies"
          brew update
          brew install make ldid dpkg gpatch libmd
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          echo "::endgroup::"

      - name: Clone Theos
        run: |
          echo "::group::Install Theos"
          rm -rf "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "::endgroup::"

      - name: Install Theos SDKs
        run: |
          echo "::group::Install Theos SDKs"
          rm -rf "$THEOS/sdks"
          git clone https://github.com/theos/sdks.git "$THEOS/sdks"
          ls -la "$THEOS/sdks"
          echo "::endgroup::"

      - name: Verify toolchain + libc++ headers
        run: |
          echo "::group::Toolchain Debug"
          xcode-select -p
          xcodebuild -version
          CXX="$(xcrun --sdk iphoneos --find clang++)"
          echo "clang++: $CXX"
          TOOLCHAIN_DIR="$(dirname "$(dirname "$CXX")")"
          echo "toolchain dir: $TOOLCHAIN_DIR"
          ls -la "$TOOLCHAIN_DIR/usr/include/c++/v1/string"
          echo "::endgroup::"

      - name: Build LIBKRW package
        run: |
          echo "::group::Build LIBKRW Package"

          # Force iOS compilers from Xcode
          export TARGET_CC="$(xcrun --sdk iphoneos --find clang)"
          export TARGET_CXX="$(xcrun --sdk iphoneos --find clang++)"

          # Force libc++ headers (fixes: fatal error: 'string' file not found)
          TOOLCHAIN_DIR="$(dirname "$(dirname "$TARGET_CXX")")"
          LIBCXX_INC="$TOOLCHAIN_DIR/usr/include/c++/v1"

          rm -rf packages
          mkdir -p packages

          cp control.template control
          sed -i '' 's/{{.depends}}/libkrw/g' control

          USE_LIBKRW=1 gmake -j"$(sysctl -n hw.ncpu)" \
            TARGET_CC="$TARGET_CC" \
            TARGET_CXX="$TARGET_CXX" \
            ADDITIONAL_CXXFLAGS="-isystem $LIBCXX_INC" \
            package FINALPACKAGE=1

          echo "::endgroup::"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fouldecrypt-libkrw
          path: packages/*.deb
