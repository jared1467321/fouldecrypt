name: Build Fouldecrypt (LIBKRW)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Force sync and update submodules
        run: |
          echo "::group::Force Sync Submodules"
          git submodule sync --recursive
          git submodule update --init --recursive --force --remote
          git submodule foreach --recursive git reset --hard
          echo "::endgroup::"

      - name: Install dependencies
        run: |
          echo "::group::Install Dependencies"
          brew update
          brew install make ldid dpkg gpatch libmd
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          echo "::endgroup::"

      - name: Clone Theos
        run: |
          echo "::group::Install Theos"
          rm -rf "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "::endgroup::"

      - name: Install Theos SDKs
        run: |
          echo "::group::Install Theos SDKs"
          rm -rf "$THEOS/sdks"
          git clone https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "::endgroup::"

      - name: Locate libc++ headers (<string>)
        run: |
          echo "::group::Locate libc++ headers"

          # Where is the active Xcode?
          XCODE_APP="$(xcode-select -p | sed 's#/Contents/Developer##')"
          echo "Xcode app: $XCODE_APP"
          xcodebuild -version

          # Find the first match for libc++ <string>
          STRING_HDR="$(/usr/bin/find "$XCODE_APP" -type f -path '*/c++/v1/string' -print -quit)"
          if [[ -z "$STRING_HDR" ]]; then
            echo "ERROR: Could not locate libc++ header 'c++/v1/string' inside $XCODE_APP"
            echo "Dumping a few likely directories for debugging:"
            ls -la "$XCODE_APP/Contents/Developer/Toolchains" || true
            ls -la "$XCODE_APP/Contents/Developer/Platforms" || true
            exit 1
          fi

          LIBCXX_INC="$(dirname "$STRING_HDR")"
          echo "Found: $STRING_HDR"
          echo "LIBCXX_INC=$LIBCXX_INC" >> "$GITHUB_ENV"

          # Quick sanity check
          ls -la "$LIBCXX_INC/string"

          echo "::endgroup::"

      - name: Verify Theos install
        run: |
          echo "::group::Verify THEOS"
          ls -la "$THEOS/makefiles/common.mk"
          echo "::endgroup::"

      - name: Build LIBKRW package
        run: |
          echo "::group::Build LIBKRW Package"

          export TARGET_CC="$(xcrun --sdk iphoneos --find clang)"
          export TARGET_CXX="$(xcrun --sdk iphoneos --find clang++)"

          echo "TARGET_CC=$TARGET_CC"
          echo "TARGET_CXX=$TARGET_CXX"
          echo "LIBCXX_INC=$LIBCXX_INC"

          rm -rf packages
          mkdir -p packages

          cp control.template control
          sed -i '' 's/{{.depends}}/libkrw/g' control

          USE_LIBKRW=1 gmake -j"$(sysctl -n hw.ncpu)" \
            TARGET_CC="$TARGET_CC" \
            TARGET_CXX="$TARGET_CXX" \
            ADDITIONAL_CXXFLAGS="-isystem $LIBCXX_INC" \
            package FINALPACKAGE=1

          echo "::endgroup::"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fouldecrypt-libkrw
          path: packages/*.deb
