name: Build Fouldecrypt (LIBKRW)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Force sync and update submodules
        run: |
          echo "::group::Force Sync Submodules"
          git submodule sync --recursive
          git submodule update --init --recursive --force --remote
          git submodule foreach --recursive git reset --hard
          echo "::endgroup::"

      - name: Install dependencies
        run: |
          echo "::group::Install Dependencies"
          brew update
          brew install make ldid dpkg gpatch libmd
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          echo "::endgroup::"

      - name: Clone Theos
        run: |
          echo "::group::Install Theos"
          rm -rf "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "::endgroup::"

      - name: Install Theos SDKs
        run: |
          echo "::group::Install Theos SDKs"
          rm -rf "$THEOS/sdks"
          git clone https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "::endgroup::"

      - name: Locate libc++ headers for iPhoneOS
        run: |
          echo "::group::Locate libc++ headers (iPhoneOS)"

          XCODE_DEV="$(xcode-select -p)"
          echo "Xcode developer dir: $XCODE_DEV"
          xcodebuild -version

          # Prefer iPhoneOS platform libc++ headers if present
          IOS_SDK_ROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK root: $IOS_SDK_ROOT"

          CANDIDATE_1="$IOS_SDK_ROOT/usr/include/c++/v1/string"
          if [[ -f "$CANDIDATE_1" ]]; then
            LIBCXX_INC="$(dirname "$CANDIDATE_1")"
          else
            # Otherwise, search only inside the iPhoneOS platform directory
            IOS_PLATFORM="$XCODE_DEV/Platforms/iPhoneOS.platform"
            echo "Searching under: $IOS_PLATFORM"
            STRING_HDR="$(/usr/bin/find "$IOS_PLATFORM" -type f -path '*/usr/include/c++/v1/string' -print -quit)"
            if [[ -z "$STRING_HDR" ]]; then
              echo "ERROR: Could not locate libc++ header 'string' for iPhoneOS."
              echo "As a fallback, show any platform hits (first 10):"
              /usr/bin/find "$XCODE_DEV/Platforms" -type f -path '*/usr/include/c++/v1/string' | head -n 10 || true
              exit 1
            fi
            LIBCXX_INC="$(dirname "$STRING_HDR")"
          fi

          echo "LIBCXX_INC=$LIBCXX_INC"
          echo "LIBCXX_INC=$LIBCXX_INC" >> "$GITHUB_ENV"
          ls -la "$LIBCXX_INC/string"

          echo "::endgroup::"

      - name: Verify Theos install
        run: |
          echo "::group::Verify THEOS"
          ls -la "$THEOS/makefiles/common.mk"
          echo "::endgroup::"

      - name: Build LIBKRW package
        run: |
          echo "::group::Build LIBKRW Package"

          export TARGET_CC="$(xcrun --sdk iphoneos --find clang)"
          export TARGET_CXX="$(xcrun --sdk iphoneos --find clang++)"

          echo "TARGET_CC=$TARGET_CC"
          echo "TARGET_CXX=$TARGET_CXX"
          echo "LIBCXX_INC=$LIBCXX_INC"

          rm -rf packages
          mkdir -p packages

          cp control.template control
          sed -i '' 's/{{.depends}}/libkrw/g' control

          # Use CXXFLAGS/CPPFLAGS to ensure the include path propagates everywhere
          export CPPFLAGS="-isystem $LIBCXX_INC"
          export CXXFLAGS="-isystem $LIBCXX_INC -stdlib=libc++"

          USE_LIBKRW=1 gmake -j"$(sysctl -n hw.ncpu)" package FINALPACKAGE=1

          echo "::endgroup::"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fouldecrypt-libkrw
          path: packages/*.deb
