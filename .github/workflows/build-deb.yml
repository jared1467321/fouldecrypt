name: Build Fouldecrypt (LIBKRW)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Force sync and update submodules
        run: |
          echo "::group::Force Sync Submodules"
          git submodule sync --recursive
          git submodule update --init --recursive --force --remote
          git submodule foreach --recursive git reset --hard
          echo "::endgroup::"

      - name: Install dependencies
        run: |
          echo "::group::Install Dependencies"
          brew update
          brew install make ldid dpkg gpatch libmd
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          echo "::endgroup::"

      - name: Clone Theos
        run: |
          echo "::group::Install Theos"
          rm -rf "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "::endgroup::"

      - name: Install Theos SDKs
        run: |
          echo "::group::Install Theos SDKs"
          rm -rf "$THEOS/sdks"
          git clone https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "::endgroup::"

      - name: Locate libc++ headers for iPhoneOS
        run: |
          echo "::group::Locate libc++ headers (iPhoneOS)"
          IOS_SDK_ROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          LIBCXX_INC="$IOS_SDK_ROOT/usr/include/c++/v1"
          echo "iPhoneOS SDK root: $IOS_SDK_ROOT"
          echo "LIBCXX_INC=$LIBCXX_INC"
          ls -la "$LIBCXX_INC/string"
          echo "LIBCXX_INC=$LIBCXX_INC" >> "$GITHUB_ENV"
          echo "::endgroup::"

      - name: Verify Theos install
        run: |
          echo "::group::Verify THEOS"
          ls -la "$THEOS/makefiles/common.mk"
          echo "::endgroup::"

      - name: Build LIBKRW package
        run: |
          echo "::group::Build LIBKRW Package"

          TARGET_CC="$(xcrun --sdk iphoneos --find clang)"
          TARGET_CXX="$(xcrun --sdk iphoneos --find clang++)"

          # libc++ headers (confirmed to exist)
          COMMON_CPPFLAGS="-isystem $LIBCXX_INC"
          COMMON_CXXFLAGS="-isystem $LIBCXX_INC -stdlib=libc++"

          echo "TARGET_CC=$TARGET_CC"
          echo "TARGET_CXX=$TARGET_CXX"
          echo "LIBCXX_INC=$LIBCXX_INC"
          ls -la "$LIBCXX_INC/string"

          rm -rf packages
          mkdir -p packages

          cp control.template control
          sed -i '' 's/{{.depends}}/libkrw/g' control

          USE_LIBKRW=1 gmake -j"$(sysctl -n hw.ncpu)" \
            CC="$TARGET_CC" \
            CXX="$TARGET_CXX" \
            TARGET_CC="$TARGET_CC" \
            TARGET_CXX="$TARGET_CXX" \
            CPPFLAGS="$COMMON_CPPFLAGS" \
            CXXFLAGS="$COMMON_CXXFLAGS" \
            TARGET_CPPFLAGS="$COMMON_CPPFLAGS" \
            TARGET_CXXFLAGS="$COMMON_CXXFLAGS" \
            ADDITIONAL_CFLAGS="$COMMON_CPPFLAGS" \
            ADDITIONAL_CXXFLAGS="$COMMON_CXXFLAGS" \
            package FINALPACKAGE=1

          echo "::endgroup::"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fouldecrypt-libkrw
          path: packages/*.deb
