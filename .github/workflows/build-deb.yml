name: Build Fouldecrypt (LIBKRW)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Force sync and update submodules
        run: |
          echo "::group::Force Sync Submodules"
          git submodule sync --recursive
          git submodule update --init --recursive --force --remote
          git submodule foreach --recursive git reset --hard
          echo "::endgroup::"

      - name: Select Xcode and show SDKs
        run: |
          echo "::group::Xcode / SDK Debug"
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --find clang++
          echo "::endgroup::"

      - name: Install dependencies
        run: |
          echo "::group::Install Dependencies"
          brew update
          brew install make ldid dpkg gpatch libmd
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          echo "::endgroup::"

      - name: Clone Theos
        run: |
          echo "::group::Install Theos"
          rm -rf "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "::endgroup::"

      - name: Install Theos SDKs
        run: |
          echo "::group::Install Theos SDKs"
          rm -rf "$THEOS/sdks"
          git clone https://github.com/theos/sdks.git "$THEOS/sdks"
          ls -la "$THEOS/sdks"
          echo "::endgroup::"

      - name: Verify Theos install
        run: |
          echo "::group::Verify THEOS"
          ls -la "$THEOS/makefiles/common.mk"
          echo "::endgroup::"

      - name: Build LIBKRW package
        run: |
          echo "::group::Build LIBKRW Package"

          # Force iOS toolchain compilers (these provide libc++ headers like <string>)
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CXX="$(xcrun --sdk iphoneos --find clang++)"

          rm -rf packages
          mkdir -p packages

          cp control.template control
          sed -i '' 's/{{.depends}}/libkrw/g' control

          USE_LIBKRW=1 gmake -j"$(sysctl -n hw.ncpu)" package FINALPACKAGE=1

          echo "::endgroup::"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fouldecrypt-libkrw
          path: packages/*.deb
